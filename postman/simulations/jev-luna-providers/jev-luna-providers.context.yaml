simulation: "jev-luna-providers"
generated: "2026-11-18"

# What this simulation stands in for and what work it unblocks. Both need
# hindsight, so they are the last thing to write. The members it serves, their
# route keys and the hosts they answer for are in the .sim.yaml beside this file.
purpose:
  stands_in_for: >-
    TypeSafe System One (Jev, https://api.typesafe.ai/v1/systemone via @typesafe-ai/sdk 0.7.0) and
    OpenAI Decisions (Luna, gpt-6-luna, https://api.openai.com/v1/decisions via fetch), at the
    latencies the repo records as observed (164 ms / 285 ms, fixed). The stand-ins answer from the
    serialized request only; they do not imitate either model's judgment.
  unblocks: >-
    Running the real adapters and the real game server in live mode (JEV_MOCK=0, LUNA_MOCK=0) with
    no provider quota: wire contract, answer decoding, cooldowns and the stroke-triggered tactical
    loop. It does not unblock comparing Jev and Luna; any score earned against these stand-ins
    measures the stand-ins' heuristic, not a model. Failure paths live in jev-luna-degraded.

