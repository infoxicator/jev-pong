    reason: >-
      The adapter accepts /^gpt-6-luna(?:-|$)/. Live answers were accepted, so the real value matched
      that pattern on 2026-11-17, but its exact form was not recorded, and the stand-in always sends the bare name.
    verification: Inferred from 2026-11-17 live answers being decoded; the value itself was not logged.
