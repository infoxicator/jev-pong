assumptions:
  - id: jev-systemone-wire-shape
    status: supported
    claim: >-
      For the game's choice questions, System One accepts POST /v1/systemone with
      {model, state, questions: {<name>: {type: "choice", criteria: {<label>: <text>}}}} and answers
      {model, answers: {<name>: {type: "choice", choice, confidence, probabilities: {<label>: n}}}, usage}.
    reason: >-
      The SDK's own types and request code define this shape, and the same adapter decoded real
      answers in a live run. Scope is choice questions only; noul/score/box are never sent.
    verification: >-
      2026-11-18: read @typesafe-ai/sdk 0.7.0 types (ChoiceQuestion, ChoiceResponse, SystemOneResult)
      and systemOne(), which POSTs to /v1/systemone. 2026-11-17 live benchmark (thread "Evaluate
      Fairness of Pong Benchmark"): 48 real Jev requests through tacticalJev, 24/24 deadlines met,
      answers decoded. 2026-11-18 baseline run of this simulation: createBrain and tacticalJev
      decoded the stand-in's answers with no transport override (fingerprint sim-2026-11-18).
    source: >-
      node_modules/@typesafe-ai/sdk/dist/index.d.mts:70-200; node_modules/@typesafe-ai/sdk/dist/index.mjs:946-965;
      server/jev.ts:14-36; server/benchmark-providers.ts:64-92
    updated_at: "2026-11-18"
  - id: luna-decisions-wire-shape
    status: supported
    claim: >-
      Decisions accepts POST /v1/decisions with {model: "gpt-6-luna", input: [{role: "user", content:
      [input_text, input_json]}], questions: [{type: "choice", name, choices: [{value}]}]} and answers
      {model, answers: [{type: "choice", name, choice, confidence, probabilities}], usage}, with answers
      identified by name rather than position.
    reason: >-
      The adapter was written against this contract and decoded real answers live. The order of
      real answers was not recorded, so the adapter matches by name; the stand-in returns them reversed
      to keep that honest.
    verification: >-
      2026-11-17 live benchmark: 48 real Luna requests, 22/24 within the 750 ms deadline, answers
