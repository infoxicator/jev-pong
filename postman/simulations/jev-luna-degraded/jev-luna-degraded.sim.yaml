# One failure per member, so each result is attributable:
#   jev  hangs 1700 ms, past the adapters' 1500 ms client timeout and AbortSignal
#   luna answers 2 requests per minute, then 429 with Retry-After
# Context and evidence: jev-luna-degraded.context.yaml. How to run: postman/simulations/README.md.
simulation: jev-luna-degraded
routing: path
mocks:
  - name: jev-systemone
    routeKey: jev
    origin:
      - api.typesafe.ai
    path: postman/mocks/jev-systemone
    scenarios:
      - overrides:
          conditions:
            latency: { delay_ms: 1700 }
  - name: luna-decisions
    routeKey: luna
    origin:
      - api.openai.com
    path: postman/mocks/luna-decisions
    scenarios:
      - overrides:
          conditions:
            rate_limit: { requests_per_minute: 2 }
